<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Skin&Shade Beranda"><img src="assets/skinshade-logo.png" alt="Logo Skin&Shade" class="brand-logo"><span class="brand-word">Skin<span>&amp;</span>Shade</span></a>
  <button class="menu-toggle" aria-label="Buka menu" aria-expanded="false">☰</button>
  <nav class="nav-links" aria-label="Navigasi utama">
    <a href="index.html" data-nav="home">Beranda</a>

  <div class="nav-auth"><a class="login-link" href="login.html">Masuk</a><a class="btn btn-small" href="register.html">Daftar</a></div>

<main>

<section class="auth-wrap"><div class="auth-card"><img class="auth-logo" src="assets/skinshade-logo.png" alt="Logo Skin&Shade"><h1>Buat akun</h1><p>Mulai perjalanan memahami kulitmu bersama Skin&amp;Shade.</p>
<form id="register-form" novalidate><div class="form-field"><label for="reg-name">Nama lengkap</label><input id="reg-name" type="text" placeholder="Nama kamu" autocomplete="name" required></div><div class="form-field"><label for="reg-email">Email</label><input id="reg-email" type="email" placeholder="nama@email.com" autocomplete="email" required></div><div class="form-field"><label for="reg-password">Kata sandi</label><input id="reg-password" type="password" placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password" required></div><div class="form-field"><label for="reg-confirm">Konfirmasi kata sandi</label><input id="reg-confirm" type="password" placeholder="Ulangi kata sandi" minlength="8" autocomplete="new-password" required></div><button class="btn" type="submit">Daftar</button><div class="form-message" id="register-message" role="status"></div></form>
<div class="auth-foot">Sudah punya akun? <a class="text-link" href="login.html">Masuk</a></div><div class="auth-foot"><a class="text-link" href="index.html">← Kembali ke beranda</a></div></div></section>

</main>
<footer class="site-footer">
  <a class="footer-brand" href="index.html">Skin&amp;Shade</a>
  <p>Kenali kulitmu, rawat dengan lebih bijak.</p>
